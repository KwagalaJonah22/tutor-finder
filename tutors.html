<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorConnect | Find Tutors in Uganda</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-chalkboard-user"></i>
                <h2>Tutor<span>Connect</span></h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="tutors.html" class="active"><i class="fas fa-users"></i> Find Tutors</a></li>
                <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="tutors-header">
            <h1><i class="fas fa-chalkboard-user"></i> Our Expert Tutors</h1>
            <p>Browse and connect with the best tutors in Uganda</p>
        </section>

        <section class="filter-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name or subject..." class="search-input">
            </div>
            <select id="subjectFilter" class="filter-select">
                <option value="all">All Subjects</option>
                <option value="Mathematics">📐 Mathematics</option>
                <option value="Physics">⚡ Physics</option>
                <option value="Chemistry">🧪 Chemistry</option>
                <option value="Biology">🧬 Biology</option>
                <option value="English">📖 English</option>
                <option value="Computer Science">💻 Computer Science</option>
            </select>
        </section>

        <section class="tutors-grid" id="tutorsGrid"></section>
    </main>

    <footer>
        <div class="footer-content">
            <p><i class="far fa-copyright"></i> 2026 TutorConnect. All rights reserved.</p>
            <p>Cavendish University Uganda - Examination 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
